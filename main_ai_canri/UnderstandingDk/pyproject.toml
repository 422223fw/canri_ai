[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "UnderstandingDk"
version = "1.0.0"
description = "A smart dictionary + semantic connections engine"
readme = "README.md"

authors = [
    { name = "motlon" }
]

license = { text = "Apache-2.0" }

requires-python = ">=3.8"

dependencies = []

[tool.setuptools]
packages = ["UnderstandingDk"]

[tool.setuptools.package-dir]
UnderstandingDk = "."

[tool.setuptools.package-data]
UnderstandingDk = ["data/*.json"]
